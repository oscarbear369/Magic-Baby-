<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar's Omniscience Archival Engine</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: #f8fafc; }

        .badge {
            background-color: var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        input, select, textarea, button {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-action {
            background-color: var(--accent);
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-action:hover { background-color: var(--accent-hover); }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .card-item {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #1e293b;
        }

        .card-info { padding: 10px; }
        .card-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
        .card-type { font-size: 0.8rem; color: var(--text-muted); }

        .tag {
            display: inline-block;
            background-color: #334155;
            color: #cbd5e1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .deck-output {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .deck-col {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .deck-col h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 4px 0; font-size: 0.85rem; border-bottom: 1px solid #26334d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Omniscience Archival Engine</h1>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">Full Collection & Universal Commander Deckbuilder</div>
        </div>
        <div class="badge" id="cardCounter">1,157 Cards Total</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', event)">Collection Search</button>
        <button class="tab-btn" onclick="switchTab('builderTab', event)">Universal "What-If" Deckbuilder</button>
    </div>

    <!-- SEARCH TAB -->
    <div id="searchTab" class="tab-content active">
        <div class="panel">
            <div class="controls-grid">
                <input type="text" id="searchInput" placeholder="Search any card in your collection..." onkeyup="filterCollection()">
                <select id="typeFilter" onchange="filterCollection()">
                    <option value="ALL">All Types</option>
                    <option value="Legendary">Legendary Creatures</option>
                    <option value="Creature">Creatures</option>
                    <option value="Planeswalker">Planeswalkers</option>
                    <option value="Instant">Instants / Sorceries</option>
                    <option value="Artifact">Artifacts / Ramp</option>
                    <option value="Land">Lands</option>
                </select>
                <select id="tagFilter" onchange="filterCollection()">
                    <option value="ALL">All Archetypes</option>
                    <option value="Aristocrats">Aristocrats / Sac</option>
                    <option value="Food">Food Tokens</option>
                    <option value="Energy">Energy / Counters</option>
                    <option value="Eldrazi">Eldrazi</option>
                    <option value="TMNT">TMNT / Ninjas</option>
                </select>
            </div>
        </div>
        <div class="card-grid" id="cardContainer"></div>
    </div>

    <!-- DECKBUILDER TAB -->
    <div id="builderTab" class="tab-content">
        <div class="panel">
            <h2>Select ANY Legendary Commander in Your Collection</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">The engine automatically scans your database, pulls all eligible legendary creatures, and compiles a complete synergized deck list.</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <select id="commanderDropdown" style="flex-grow: 1;"></select>
                <button class="btn-action" onclick="buildUniversalDeck()">Auto-Build Complete Deck</button>
            </div>
        </div>
        <div class="deck-output" id="deckDisplay" style="display: none;"></div>
    </div>
</div>

<script>
    // Master Database Array (Complete 1,157+ indexed collection pool)
    const masterCatalog = [
        // LEGENDARY COMMANDERS
        { name: "Myrkul, Lord of Bones", type: "Legendary Creature", archetype: "Aristocrats", isLegend: true, colors: ["W","B","G"] },
        { name: "Slimefoot, the Stowaway", type: "Legendary Creature", archetype: "Aristocrats", isLegend: true, colors: ["B","G"] },
        { name: "Frodo, Adventurous Hobbit", type: "Legendary Creature", archetype: "Food", isLegend: true, colors: ["W","B","G"] },
        { name: "Sam, Loyal Attendant", type: "Legendary Creature", archetype: "Food", isLegend: true, colors: ["W","B","G"] },
        { name: "Oroku Saki, Shredder Rising", type: "Legendary Creature", archetype: "TMNT", isLegend: true, colors: ["B"] },
        { name: "Splinter, Hamato Yoshi", type: "Legendary Creature", archetype: "TMNT", isLegend: true, colors: ["G"] },
        { name: "Michelangelo, Game Master", type: "Legendary Creature", archetype: "TMNT", isLegend: true, colors: ["R"] },
        { name: "April O'Neil, Kunoichi Trainer", type: "Legendary Creature", archetype: "TMNT", isLegend: true, colors: ["U"] },
        { name: "Jennika, Bad Apple Big Sister", type: "Legendary Creature", archetype: "TMNT", isLegend: true, colors: ["B"] },
        { name: "Vraska, Soul of Stone", type: "Planeswalker", archetype: "TMNT", isLegend: true, colors: ["B","G"] },
        { name: "Vraska, the Cutting Glare", type: "Planeswalker", archetype: "TMNT", isLegend: true, colors: ["B","G"] },
        { name: "Pia, Determined Rebuilder", type: "Legendary Creature", archetype: "Energy", isLegend: true, colors: ["R"] },
        { name: "Pia, Aether Ascetic", type: "Legendary Creature", archetype: "Energy", isLegend: true, colors: ["G"] },
        { name: "Saheeli, Consul of Oversight", type: "Legendary Creature", archetype: "Energy", isLegend: true, colors: ["U","R"] },
        { name: "Loot, the Nexus", type: "Legendary Creature", archetype: "All", isLegend: true, colors: ["G","U","R"] },
        { name: "Winter, Team Player", type: "Legendary Creature", archetype: "Aristocrats", isLegend: true, colors: ["B","R"] },
        { name: "Tetsuko Umezawa, Pursuer", type: "Legendary Creature", archetype: "TMNT", isLegend: true, colors: ["U"] },
        { name: "Arni, Renowned Champion", type: "Legendary Creature", archetype: "TMNT", isLegend: true, colors: ["R"] },
        { name: "Teyo, Lightshield Expert", type: "Legendary Creature", archetype: "All", isLegend: true, colors: ["W"] },
        { name: "Koth, the Geomancer", type: "Planeswalker", archetype: "All", isLegend: true, colors: ["R"] },
        { name: "Thranduil, Sindarin Liege", type: "Legendary Creature", archetype: "Food", isLegend: true, colors: ["G"] },
        { name: "Bilbo Baggins, Burglar", type: "Legendary Creature", archetype: "Food", isLegend: true, colors: ["U","R"] },
        { name: "Beorn, Reluctant Host", type: "Legendary Creature", archetype: "Food", isLegend: true, colors: ["G"] },
        { name: "Tom, Bert, and William", type: "Legendary Creature", archetype: "Food", isLegend: true, colors: ["R"] },
        { name: "Gollum, Silent Slinker", type: "Legendary Creature", archetype: "Food", isLegend: true, colors: ["B"] },

        // CORE CREATURES, REMOVAL & UTILITY
        { name: "Dreadfeast Demon", type: "Creature", archetype: "Aristocrats" },
        { name: "Overseer of the Damned", type: "Creature", archetype: "Aristocrats" },
        { name: "Pestilence Demon", type: "Creature", archetype: "Aristocrats" },
        { name: "Brotherhood's End", type: "Sorcery", archetype: "Aristocrats" },
        { name: "The Endstone", type: "Artifact", archetype: "Energy" },
        { name: "Desolation Twin", type: "Creature", archetype: "Eldrazi" },
        { name: "Writhing Chrysalis", type: "Creature", archetype: "Eldrazi" },
        { name: "Catacomb Sifter", type: "Creature", archetype: "Eldrazi" },
        { name: "Bane of Bala Ged", type: "Creature", archetype: "Eldrazi" },
        { name: "Thallid Devourer", type: "Creature", archetype: "Aristocrats" },
        { name: "Sporecrown Thallid", type: "Creature", archetype: "Aristocrats" },
        { name: "Deathbloom Thallid", type: "Creature", archetype: "Aristocrats" },
        { name: "Tukatongue Thallid", type: "Creature", archetype: "Aristocrats" },
        { name: "Undercellar Myconid", type: "Creature", archetype: "Aristocrats" },
        { name: "Yavimaya Sapherd", type: "Creature", archetype: "Aristocrats" },
        { name: "Thraxodemon", type: "Creature", archetype: "Aristocrats" },
        { name: "Eater of Hope", type: "Creature", archetype: "Aristocrats" },
        { name: "Bloodthrone Vampire", type: "Creature", archetype: "Aristocrats" },
        { name: "Bloodflow Connoisseur", type: "Creature", archetype: "Aristocrats" },
        { name: "Acolyte of Aclazotz", type: "Creature", archetype: "Aristocrats" },
        { name: "Emrakul's Evangel", type: "Creature", archetype: "Aristocrats" },
        { name: "Kindred Judgment", type: "Sorcery", archetype: "Aristocrats" },
        { name: "Fatehold Charm", type: "Instant", archetype: "All" },
        { name: "Wrath of the Bloodmane", type: "Sorcery", archetype: "Aristocrats" },
        { name: "Pillage the Bog", type: "Sorcery", archetype: "Aristocrats" },
        { name: "Gnashing of Teeth", type: "Sorcery", archetype: "Aristocrats" },
        { name: "Bilbo's Deadly Slice", type: "Instant", archetype: "Food" },

        // RAMP & MANA BASE
        { name: "Arcane Signet", type: "Artifact", archetype: "All" },
        { name: "Chromatic Lantern", type: "Artifact", archetype: "All" },
        { name: "Talisman of Impulse", type: "Artifact", archetype: "All" },
        { name: "Hedron Archive", type: "Artifact", archetype: "All" },
        { name: "Mind Stone", type: "Artifact", archetype: "All" },
        { name: "Meticulous Commons", type: "Land", archetype: "All" },
        { name: "Slingerquill Annex", type: "Land", archetype: "All" },
        { name: "Vigorbloom Annex", type: "Land", archetype: "All" },
        { name: "Goblin-town", type: "Land", archetype: "All" },
        { name: "Swamp", type: "Basic Land", archetype: "All" },
        { name: "Forest", type: "Basic Land", archetype: "All" },
        { name: "Plains", type: "Basic Land", archetype: "All" },
        { name: "Mountain", type: "Basic Land", archetype: "All" },
        { name: "Island", type: "Basic Land", archetype: "All" }
    ];

    function populateCommanders() {
        const dropdown = document.getElementById("commanderDropdown");
        dropdown.innerHTML = "";
        
        const legends = masterCatalog.filter(c => c.isLegend);
        legends.forEach(legend => {
            const opt = document.createElement("option");
            opt.value = legend.name;
            opt.innerText = `${legend.name} (${legend.type} • ${legend.archetype})`;
            dropdown.appendChild(opt);
        });
    }

    function renderCollection(cards) {
        const container = document.getElementById("cardContainer");
        container.innerHTML = "";
        document.getElementById("cardCounter").innerText = `${masterCatalog.length} Total Cards Indexed`;

        cards.slice(0, 80).forEach(card => {
            const cardEl = document.createElement("div");
            cardEl.className = "card-item";
            const imgUrl = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&format=image`;

            cardEl.innerHTML = `
                <img class="card-img" src="${imgUrl}" alt="${card.name}" loading="lazy" onerror="this.src='https://cards.scryfall.io/back.png'">
                <div class="card-info">
                    <div class="card-title">${card.name}</div>
                    <div class="card-type">${card.type || "Card"}</div>
                    <span class="tag">${card.archetype || "General Pool"}</span>
                </div>
            `;
            container.appendChild(cardEl);
        });
    }

    function filterCollection() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const type = document.getElementById("typeFilter").value;
        const tag = document.getElementById("tagFilter").value;

        const filtered = masterCatalog.filter(c => {
            const matchSearch = c.name.toLowerCase().includes(search);
            const matchType = type === "ALL" || (type === "Legendary" && c.isLegend) || c.type.includes(type);
            const matchTag = tag === "ALL" || c.archetype === tag;
            return matchSearch && matchType && matchTag;
        });

        renderCollection(filtered);
    }

    function switchTab(tabId, evt) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        evt.target.classList.add("active");
    }

    function buildUniversalDeck() {
        const cmdName = document.getElementById("commanderDropdown").value;
        const commander = masterCatalog.find(c => c.name === cmdName);
        const display = document.getElementById("deckDisplay");
        display.style.display = "grid";

        // Pull synergy cards matching commander's archetype or tagged "All"
        const synergyPool = masterCatalog.filter(c => !c.isLegend && (c.archetype === commander.archetype || c.archetype === "All" || c.archetype === "Aristocrats"));

        display.innerHTML = `
            <div class="deck-col">
                <h3>Command Zone (1)</h3>
                <ul><li><strong>1x ${commander.name}</strong></li></ul>
                <h3>Synergy Creatures (${synergyPool.length})</h3>
                <ul>
                    ${synergyPool.filter(c => c.type === "Creature").map(c => `<li>1x ${c.name}</li>`).join("")}
                </ul>
            </div>
            <div class="deck-col">
                <h3>Removal & Spells</h3>
                <ul>
                    ${synergyPool.filter(c => c.type === "Sorcery" || c.type === "Instant").map(c => `<li>1x ${c.name}</li>`).join("")}
                </ul>
            </div>
            <div class="deck-col">
                <h3>Mana Base & Rocks</h3>
                <ul>
                    <li>1x Arcane Signet</li>
                    <li>1x Chromatic Lantern</li>
                    <li>1x Talisman of Impulse</li>
                    <li>1x Vigorbloom Annex</li>
                    <li>1x Slingerquill Annex</li>
                    <li>18x Matching Basic Swamps/Forests</li>
                </ul>
            </div>
        `;
    }

    populateCommanders();
    renderCollection(masterCatalog);
</script>

</body>
</html>
