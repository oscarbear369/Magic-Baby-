<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar's MTG Archival Hub</title>
    <script src="cards.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: #f8fafc; }

        .badge {
            background-color: var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        input, select, button {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-action {
            background-color: var(--accent);
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-action:hover { background-color: var(--accent-hover); }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .card-item {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #1e293b;
        }

        .card-info { padding: 10px; }
        .card-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
        .card-type { font-size: 0.8rem; color: var(--text-muted); }

        .tag {
            display: inline-block;
            background-color: #334155;
            color: #cbd5e1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .deck-output {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .deck-col {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .deck-col h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 4px 0; font-size: 0.85rem; border-bottom: 1px solid #26334d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Oscar's MTG Master Hub</h1>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">Full Dynamic Collection & Commander Engine</div>
        </div>
        <div class="badge" id="cardCounter">Loading Catalog...</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', event)">Collection Search</button>
        <button class="tab-btn" onclick="switchTab('builderTab', event)">"What-If" Deckbuilder</button>
    </div>

    <!-- SEARCH TAB -->
    <div id="searchTab" class="tab-content active">
        <div class="panel">
            <div class="controls-grid">
                <input type="text" id="searchInput" placeholder="Search any card in your collection..." onkeyup="filterCollection()">
                <select id="typeFilter" onchange="filterCollection()">
                    <option value="ALL">All Types</option>
                    <option value="Legendary">Legendary Commanders</option>
                    <option value="Creature">Creatures</option>
                    <option value="Instant">Instants / Sorceries</option>
                    <option value="Artifact">Artifacts / Ramp</option>
                    <option value="Land">Lands</option>
                </select>
            </div>
        </div>
        <div class="card-grid" id="cardContainer"></div>
    </div>

    <!-- DECKBUILDER TAB -->
    <div id="builderTab" class="tab-content">
        <div class="panel">
            <h2>Select ANY Commander in Your Collection</h2>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <select id="commanderDropdown" style="flex-grow: 1;"></select>
                <button class="btn-action" onclick="buildDeckForCommander()">Auto-Build 100-Card Deck</button>
            </div>
        </div>
        <div class="deck-output" id="deckDisplay" style="display: none;"></div>
    </div>
</div>

<script>
    let masterCatalog = [];

    const legendsMap = {
        "Myrkul, Lord of Bones": "Legendary Creature",
        "Slimefoot, the Stowaway": "Legendary Creature",
        "Frodo, Adventurous Hobbit": "Legendary Creature",
        "Sam, Loyal Attendant": "Legendary Creature",
        "Oroku Saki, Shredder Rising": "Legendary Creature",
        "Splinter, Hamato Yoshi": "Legendary Creature",
        "Michelangelo, Game Master": "Legendary Creature",
        "April O'Neil, Kunoichi Trainer": "Legendary Creature",
        "Jennika, Bad Apple Big Sister": "Legendary Creature",
        "Vraska, Soul of Stone": "Planeswalker",
        "Vraska, the Cutting Glare": "Planeswalker",
        "Pia, Determined Rebuilder": "Legendary Creature",
        "Pia, Aether Ascetic": "Legendary Creature",
        "Saheeli, Consul of Oversight": "Legendary Creature",
        "Loot, the Nexus": "Legendary Creature",
        "Winter, Team Player": "Legendary Creature",
        "Tetsuko Umezawa, Pursuer": "Legendary Creature",
        "Arni, Renowned Champion": "Legendary Creature",
        "Teyo, Lightshield Expert": "Legendary Creature",
        "Koth, the Geomancer": "Planeswalker"
    };

    function initApp() {
        const list = window.FULL_MTG_CATALOG || [];
        masterCatalog = list.map(name => {
            const isLeg = !!legendsMap[name];
            let cardType = isLeg ? legendsMap[name] : "Creature";

            if (["Swamp","Forest","Plains","Mountain","Island","Meticulous Commons","Slingerquill Annex","Vigorbloom Annex","Goblin-town"].includes(name)) {
                cardType = "Land";
            } else if (["Arcane Signet","Chromatic Lantern","Talisman of Impulse","Hedron Archive","Mind Stone","Reckoner Bankbuster","Mirage Mirror","Sting, Bilbo's Sword","The Endstone"].includes(name)) {
                cardType = "Artifact";
            } else if (["Brotherhood's End","Kindred Judgment","Fatehold Charm","Wrath of the Bloodmane","Bilbo's Deadly Slice","Gnashing of Teeth","Pillage the Bog","Gleeful Sabotage","Compel Brutality"].includes(name)) {
                cardType = "Instant/Sorcery";
            }

            return { name: name, type: cardType, isLegend: isLeg };
        });

        populateCommanders();
        filterCollection();
    }

    function populateCommanders() {
        const dropdown = document.getElementById("commanderDropdown");
        dropdown.innerHTML = "";

        const legends = masterCatalog.filter(c => c.isLegend);
        legends.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.name;
            opt.innerText = `${l.name} (${l.type})`;
            dropdown.appendChild(opt);
        });
    }

    function renderCollection(cards) {
        const container = document.getElementById("cardContainer");
        container.innerHTML = "";
        document.getElementById("cardCounter").innerText = `${masterCatalog.length} Total Cards Indexed`;

        cards.slice(0, 100).forEach(card => {
            const cardEl = document.createElement("div");
            cardEl.className = "card-item";
            const imgUrl = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&format=image`;

            cardEl.innerHTML = `
                <img class="card-img" src="${imgUrl}" alt="${card.name}" loading="lazy" onerror="this.src='https://cards.scryfall.io/back.png'">
                <div class="card-info">
                    <div class="card-title">${card.name}</div>
                    <div class="card-type">${card.type}</div>
                </div>
            `;
            container.appendChild(cardEl);
        });
    }

    function filterCollection() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const type = document.getElementById("typeFilter").value;

        const filtered = masterCatalog.filter(c => {
            const matchSearch = c.name.toLowerCase().includes(search);
            const matchType = type === "ALL" || (type === "Legendary" && c.isLegend) || c.type.includes(type);
            return matchSearch && matchType;
        });

        renderCollection(filtered);
    }

    function switchTab(tabId, evt) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        evt.target.classList.add("active");
    }

    function buildDeckForCommander() {
        const cmdName = document.getElementById("commanderDropdown").value;
        const display = document.getElementById("deckDisplay");
        display.style.display = "grid";

        const pool = masterCatalog.filter(c => c.name !== cmdName);
        const creatures = pool.filter(c => c.type === "Creature" || c.type === "Legendary Creature");
        const spells = pool.filter(c => c.type === "Instant/Sorcery");
        const artifacts = pool.filter(c => c.type === "Artifact");
        const lands = pool.filter(c => c.type === "Land" && !["Swamp","Forest","Plains","Mountain","Island"].includes(c.name));

        const selectedCreatures = creatures.slice(0, 30);
        const selectedSpells = spells.slice(0, 16);
        const selectedArtifacts = artifacts.slice(0, 10);
        const selectedLands = lands.slice(0, 6);

        const totalSelected = 1 + selectedCreatures.length + selectedSpells.length + selectedArtifacts.length + selectedLands.length;
        const basicsNeeded = 100 - totalSelected;

        display.innerHTML = `
            <div class="deck-col">
                <h3>Command Zone (1)</h3>
                <ul><li><strong>1x ${cmdName}</strong></li></ul>
                <h3>Owned Creatures (${selectedCreatures.length})</h3>
                <ul>${selectedCreatures.map(c => `<li>1x ${c.name}</li>`).join("")}</ul>
            </div>
            <div class="deck-col">
                <h3>Removal & Spells (${selectedSpells.length})</h3>
                <ul>${selectedSpells.map(c => `<li>1x ${c.name}</li>`).join("")}</ul>
                <h3>Ramp & Artifacts (${selectedArtifacts.length})</h3>
                <ul>${selectedArtifacts.map(c => `<li>1x ${c.name}</li>`).join("")}</ul>
            </div>
            <div class="deck-col">
                <h3>Lands & Mana (${selectedLands.length + basicsNeeded})</h3>
                <ul>
                    ${selectedLands.map(c => `<li>1x ${c.name}</li>`).join("")}
                    <li>${Math.ceil(basicsNeeded * 0.5)}x Basic Swamps / Forests</li>
                    <li>${Math.floor(basicsNeeded * 0.5)}x Basic Mountains / Plains / Islands</li>
                </ul>
            </div>
        `;
    }

    window.onload = initApp;
</script>

</body>
</html>
