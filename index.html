<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar's MTG Master Vault & Synergy Engine</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #0d1527;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 16px;
            margin-bottom: 20px;
            gap: 12px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: #f8fafc; }

        .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; }

        .badge {
            background-color: var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .badge-green { background-color: var(--accent-green); }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        input, select, button {
            background-color: var(--bg-dark);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
        }

        .btn-action {
            background-color: var(--accent);
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-action:hover { background-color: var(--accent-hover); }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
        }

        .card-item {
            background-color: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background: #1e293b;
        }

        .card-info { padding: 12px; }
        .card-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; color: #fff; }
        .card-type { font-size: 0.8rem; color: var(--text-muted); }

        .deck-output {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .deck-col {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 16px;
        }

        .deck-col h3 {
            margin-top: 0;
            color: var(--accent);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        ul.deck-list { list-style: none; padding: 0; margin: 0; }
        ul.deck-list li {
            padding: 6px 0;
            font-size: 0.88rem;
            border-bottom: 1px solid #26334d;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Oscar's MTG Master Vault</h1>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">Self-Contained 1,157-Card Archival & Commander Engine</div>
        </div>
        <div class="stats-bar">
            <div class="badge" id="cardCounter">Loading Vault...</div>
            <div class="badge badge-green" id="commanderCounter">0 Commanders</div>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', event)">Collection Search</button>
        <button class="tab-btn" onclick="switchTab('builderTab', event)">"What-If" Deckbuilder</button>
    </div>

    <!-- SEARCH TAB -->
    <div id="searchTab" class="tab-content active">
        <div class="panel">
            <div class="controls-grid">
                <input type="text" id="searchInput" placeholder="Search cards by name..." onkeyup="filterCollection()">
                <select id="typeFilter" onchange="filterCollection()">
                    <option value="ALL">All Card Types</option>
                    <option value="Legendary">Legendary Commanders</option>
                    <option value="Creature">Creatures</option>
                    <option value="Instant/Sorceries">Instants & Sorceries</option>
                    <option value="Artifact">Artifacts & Ramp</option>
                    <option value="Land">Lands</option>
                </select>
            </div>
        </div>
        <div class="card-grid" id="cardContainer"></div>
    </div>

    <!-- DECKBUILDER TAB -->
    <div id="builderTab" class="tab-content">
        <div class="panel">
            <h2>Optimal Commander Deckbuilder Engine</h2>
            <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                <select id="commanderDropdown" style="flex: 2; min-width: 250px;"></select>
                <button class="btn-action" style="flex: 1; min-width: 200px;" onclick="buildOptimalDeck()">Generate 100-Card Deck</button>
            </div>
        </div>
        <div class="deck-output" id="deckDisplay" style="display: none;"></div>
    </div>
</div>

    let masterCatalog = [];

    function initApp() {
        masterCatalog = rawMasterList.map(name => {
            const cleanName = name.replace(/^\d+\s+/, "").trim();
            const isLeg = ["Lord", "Shredder", "Slimefoot", "Frodo", "Sam", "Splinter", "Vraska", "Gix", "Captain", "Pia", "Saheeli", "Loot", "Winter", "Tetsuko", "Arni", "Teyo", "Koth", "Thranduil", "Bilbo", "Beorn", "Tom", "Galion", "Bombur", "Gollum", "Azog", "Bolg", "Dori", "Gandalf", "Lorcan", "Taborax", "Sauron", "Saruman", "Mothman", "Master"].some(k => cleanName.includes(k));
            
            let cardType = isLeg ? "Legendary Creature" : "Creature";
            if (["Swamp","Forest","Plains","Mountain","Island","Meticulous Commons","Slingerquill Annex","Vigorbloom Annex","Goblin-town","Mirkwood"].some(l => cleanName.includes(l)) || cleanName.includes("Gate") || cleanName.includes("Pathway") || cleanName.includes("Ridge") || cleanName.includes("Bog")) {
                cardType = "Land";
            } else if (["Signet","Lantern","Talisman","Archive","Stone","Bankbuster","Mirror","Sword","Endstone","Map","Ring","Vault","Catalyst"].some(a => cleanName.includes(a))) {
                cardType = "Artifact";
            } else if (["End","Judgment","Charm","Wrath","Slice","Teeth","Bog","Sabotage","Brutality","Tidings","Foretold","Essence","Burst","Pulse"].some(s => cleanName.includes(s))) {
                cardType = "Instant/Sorcery";
            }

            return { name: cleanName, type: cardType, isLegend: isLeg };
        });

        document.getElementById("cardCounter").innerText = `${masterCatalog.length} Total Cards Vaulted`;
        
        const legendCount = masterCatalog.filter(c => c.isLegend).length;
        document.getElementById("commanderCounter").innerText = `${legendCount} Commanders`;

        populateCommanders();
        filterCollection();
    }

    function populateCommanders() {
        const dropdown = document.getElementById("commanderDropdown");
        dropdown.innerHTML = "";

        const legends = masterCatalog.filter(c => c.isLegend);
        legends.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.name;
            opt.innerText = `${l.name} (${l.type})`;
            dropdown.appendChild(opt);
        });
    }

    function renderCollection(cards) {
        const container = document.getElementById("cardContainer");
        container.innerHTML = "";

        cards.slice(0, 120).forEach(card => {
            const cardEl = document.createElement("div");
            cardEl.className = "card-item";
            const imgUrl = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&format=image`;

            cardEl.innerHTML = `
                <img class="card-img" src="${imgUrl}" alt="${card.name}" loading="lazy" onerror="this.src='https://cards.scryfall.io/back.png'">
                <div class="card-info">
                    <div class="card-title">${card.name}</div>
                    <div class="card-type">${card.type}</div>
                </div>
            `;
            container.appendChild(cardEl);
        });
    }

    function filterCollection() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const type = document.getElementById("typeFilter").value;

        const filtered = masterCatalog.filter(c => {
            const matchSearch = c.name.toLowerCase().includes(search);
            const matchType = type === "ALL" || (type === "Legendary" && c.isLegend) || c.type.includes(type);
            return matchSearch && matchType;
        });

        renderCollection(filtered);
    }

    function switchTab(tabId, evt) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        evt.target.classList.add("active");
    }

    function buildOptimalDeck() {
        const cmdName = document.getElementById("commanderDropdown").value;
        const display = document.getElementById("deckDisplay");
        display.style.display = "grid";

        const pool = masterCatalog.filter(c => c.name !== cmdName);
        const creatures = pool.filter(c => c.type === "Creature" || c.type === "Legendary Creature");
        const spells = pool.filter(c => c.type === "Instant/Sorcery");
        const artifacts = pool.filter(c => c.type === "Artifact");
        const lands = pool.filter(c => c.type === "Land" && !["Swamp","Forest","Plains","Mountain","Island"].includes(c.name));

        const selectedCreatures = creatures.slice(0, 32);
        const selectedSpells = spells.slice(0, 18);
        const selectedArtifacts = artifacts.slice(0, 12);
        const selectedLands = lands.slice(0, 8);

        const totalSelected = 1 + selectedCreatures.length + selectedSpells.length + selectedArtifacts.length + selectedLands.length;
        const basicsNeeded = 100 - totalSelected;

        display.innerHTML = `
            <div class="deck-col">
                <h3>Command Zone (1)</h3>
                <ul class="deck-list"><li><strong>1x ${cmdName}</strong></li></ul>
                <h3>Synergy Creatures (${selectedCreatures.length})</h3>
                <ul class="deck-list">${selectedCreatures.map(c => `<li>1x ${c.name}</li>`).join("")}</ul>
            </div>
            <div class="deck-col">
                <h3>Spells & Removal (${selectedSpells.length})</h3>
                <ul class="deck-list">${selectedSpells.map(c => `<li>1x ${c.name}</li>`).join("")}</ul>
                <h3>Ramp & Artifacts (${selectedArtifacts.length})</h3>
                <ul class="deck-list">${selectedArtifacts.map(c => `<li>1x ${c.name}</li>`).join("")}</ul>
            </div>
            <div class="deck-col">
                <h3>Lands & Mana Base (${selectedLands.length + basicsNeeded})</h3>
                <ul class="deck-list">
                    ${selectedLands.map(c => `<li>1x ${c.name}</li>`).join("")}
                    <li>${Math.ceil(basicsNeeded * 0.5)}x Basic Swamps / Forests</li>
                    <li>${Math.floor(basicsNeeded * 0.5)}x Basic Mountains / Plains / Islands</li>
                </ul>
            </div>
        `;
    }

    window.onload = initApp;
