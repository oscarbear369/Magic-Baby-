<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar's MTG Archival & Deckbuilding Hub</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: #f8fafc; }

        .badge {
            background-color: var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        input, select, textarea, button {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-action {
            background-color: var(--accent);
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-action:hover { background-color: var(--accent-hover); }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .card-item {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #1e293b;
        }

        .card-info { padding: 10px; }
        .card-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
        .card-type { font-size: 0.8rem; color: var(--text-muted); }

        .tag {
            display: inline-block;
            background-color: #334155;
            color: #cbd5e1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .deck-output {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .deck-col {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .deck-col h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 4px 0; font-size: 0.85rem; border-bottom: 1px solid #26334d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Oscar's MTG Master Matrix</h1>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">Full Collection & Smart Commander Engine</div>
        </div>
        <div class="badge" id="cardCounter">0 Cards</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', event)">Collection Search</button>
        <button class="tab-btn" onclick="switchTab('builderTab', event)">"What-If" Deckbuilder</button>
    </div>

    <!-- SEARCH TAB -->
    <div id="searchTab" class="tab-content active">
        <div class="panel">
            <div class="controls-grid">
                <input type="text" id="searchInput" placeholder="Search any card in your collection..." onkeyup="filterCollection()">
                <select id="typeFilter" onchange="filterCollection()">
                    <option value="ALL">All Card Types</option>
                    <option value="Legendary">Legendary Commanders</option>
                    <option value="Creature">Creatures</option>
                    <option value="Planeswalker">Planeswalkers</option>
                    <option value="Instant">Instants / Sorceries</option>
                    <option value="Artifact">Artifacts / Ramp</option>
                    <option value="Land">Lands</option>
                </select>
                <select id="tagFilter" onchange="filterCollection()">
                    <option value="ALL">All Archetypes</option>
                    <option value="Aristocrats">Aristocrats / Sac</option>
                    <option value="Food">Food Tokens</option>
                    <option value="Energy">Energy / Counters</option>
                    <option value="Eldrazi">Eldrazi</option>
                    <option value="TMNT">TMNT / Ninjas</option>
                </select>
            </div>
        </div>
        <div class="card-grid" id="cardContainer"></div>
    </div>

    <!-- DECKBUILDER TAB -->
    <div id="builderTab" class="tab-content">
        <div class="panel">
            <h2>Select ANY Commander in Your Collection</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">The engine filters your 1,157+ card database to find cards matching your commander's color identity and archetype synergies, then auto-constructs a complete 100-card Commander deck.</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <select id="commanderDropdown" style="flex-grow: 1;"></select>
                <button class="btn-action" onclick="buildSmartDeck()">Auto-Build Complete 100-Card Deck</button>
            </div>
        </div>
        <div class="deck-output" id="deckDisplay" style="display: none;"></div>
    </div>
</div>

<script>
    // Embedded Master Collection List
    const rawCardNames = [
        "Vraska, Soul of Stone", "Vraska, the Cutting Glare", "Brotherhood's End", "The Endstone", "Desolation Twin",
        "Writhing Chrysalis", "Catacomb Sifter", "Bane of Bala Ged", "Myrkul, Lord of Bones", "Slimefoot, the Stowaway",
        "Frodo, Adventurous Hobbit", "Sam, Loyal Attendant", "Oroku Saki, Shredder Rising", "Splinter, Hamato Yoshi",
        "Michelangelo, Game Master", "April O'Neil, Kunoichi Trainer", "Jennika, Bad Apple Big Sister", "Dreadfeast Demon",
        "Overseer of the Damned", "Pestilence Demon", "Demon of Catastrophes", "Desecration Demon", "Demon of Loathing",
        "Mindwrack Demon", "Rakshasa Debaser", "Lorcan, Warlock Collector", "Crabomination", "Taborax, Hope's Demise",
        "Eater of Hope", "Thraxodemon", "Arcane Signet", "Chromatic Lantern", "Talisman of Impulse", "Hedron Archive",
        "Mind Stone", "Reckoner Bankbuster", "Mirage Mirror", "Sting, Bilbo's Sword", "Silver Surfer, Galactus's Herald",
        "Genesis Hydra", "Forgotten Ancient", "Sunblast Angel", "The Vision", "Thranduil, Sindarin Liege",
        "Bilbo Baggins, Burglar", "Beorn, Reluctant Host", "Tom, Bert, and William", "Galion, Elvenking's Butler",
        "Bombur, Gentle Dreamer", "Gollum the Abandoned", "Azog, Moria's Ruin", "Wood Elves", "Thrór's Map",
        "Through the Forest Gate", "Mirkwood", "Bolg of the North", "Dori, Bearer of Friends", "Gandalf, Spark Starter",
        "Gollum, Silent Slinker", "Bilbo's Deadly Slice", "Gnashing of Teeth", "Gathering of Darkness", "Goblin-town",
        "Tidings of War", "Rage Into the Valley", "Doom Foretold", "Gleeful Sabotage", "Summon: Fenrir", "Syphon Essence",
        "Mechan Shieldmate", "Firja's Retribution", "Vivien's Talent", "Animist's Awakening", "Glimmerburst",
        "Walk with the Ancestors", "Plasma Bolt", "Intrepid Tenderfoot", "Verdant Mastery", "Ruthless Waterbender",
        "Molecular Modifier", "Meltsrider Eulogist", "Illvoi Operative", "Taster of Wares", "Flight-Deck Coordinator",
        "Far Traveler", "Illvoi Infiltrator", "Tameshi, Reality Architect", "Tryo, Diamondblade Mage", "Arni, Humble Scribe",
        "Gallia, Tragic Host", "Uldaros Theorix", "Way of the Deathbringer", "Rise of the Deathbringer", "Countersculpt",
        "Extended Absence", "Theorix Charm", "Sphinx's Approach", "Pia, Determined Rebuilder", "Pia, Aether Ascetic",
        "Saheeli, Consul of Oversight", "Loot, the Nexus", "Winter, Team Player", "Tetsuko Umezawa, Pursuer",
        "Arni, Renowned Champion", "Teyo, Lightshield Expert", "Koth, the Geomancer", "Kindred Judgment", "Fatehold Charm",
        "Wrath of the Bloodmane", "Meticulous Commons", "Slingerquill Annex", "Vigorbloom Annex", "Saheeli, Jewel of Avishkar",
        "Xorn of the Homestead", "Soul Salvage", "Erstwhile Trooper", "Ferocity of the Wild", "Mishra's Kirin",
        "Compel Brutality", "Tethermage's Advantage", "No Admittance", "Campus Crier", "Prudent Fateseer", "Inspired Tethermage",
        "Fulminous Forte", "Cruel Calculations", "Carnivorous Cultivator", "Flourishing Grapple", "Fatehold Chronologist",
        "Fateshaper Aspirant", "Sureshor Sower", "Something Worth Saving", "Artificer's Acumen", "Guiding Hydra",
        "Dreadflight Monstrosity", "Restore with Empathy", "Graft Surgeon", "Shattering Pegasus", "Arcane Amphisbaena",
        "Heartstring Puller", "Konstruri Improviser", "Vindicate's Triumph", "Surgical Precision", "Hexhaven Battalion",
        "Giltclaw Crusher", "Mind Murderer", "Vindictive Warden", "Giant Growth", "Moldgraf Scavenger", "Greater Sandwurm",
        "Stitched Mangler", "Ritual of Rejuvenation", "Martyr of Dusk", "Kessig Dire Strain", "Scrapsail Skaab", "Forge Devil",
        "Gatekeeper Vine", "Tackle Artist", "Roaring Embermare", "Zealous Tormentor", "Swamp", "Forest", "Plains", "Mountain", "Island"
    ];

    // Known Legends and Archetype Metadata
    const legendsMetadata = {
        "Myrkul, Lord of Bones": { isLegend: true, type: "Legendary Creature", archetype: "Aristocrats", colors: ["W","B","G"] },
        "Slimefoot, the Stowaway": { isLegend: true, type: "Legendary Creature", archetype: "Aristocrats", colors: ["B","G"] },
        "Frodo, Adventurous Hobbit": { isLegend: true, type: "Legendary Creature", archetype: "Food", colors: ["W","B","G"] },
        "Sam, Loyal Attendant": { isLegend: true, type: "Legendary Creature", archetype: "Food", colors: ["W","B","G"] },
        "Oroku Saki, Shredder Rising": { isLegend: true, type: "Legendary Creature", archetype: "TMNT", colors: ["B"] },
        "Splinter, Hamato Yoshi": { isLegend: true, type: "Legendary Creature", archetype: "TMNT", colors: ["G"] },
        "Michelangelo, Game Master": { isLegend: true, type: "Legendary Creature", archetype: "TMNT", colors: ["R"] },
        "April O'Neil, Kunoichi Trainer": { isLegend: true, type: "Legendary Creature", archetype: "TMNT", colors: ["U"] },
        "Jennika, Bad Apple Big Sister": { isLegend: true, type: "Legendary Creature", archetype: "TMNT", colors: ["B"] },
        "Vraska, Soul of Stone": { isLegend: true, type: "Planeswalker", archetype: "TMNT", colors: ["B","G"] },
        "Vraska, the Cutting Glare": { isLegend: true, type: "Planeswalker", archetype: "TMNT", colors: ["B","G"] },
        "Pia, Determined Rebuilder": { isLegend: true, type: "Legendary Creature", archetype: "Energy", colors: ["R"] },
        "Pia, Aether Ascetic": { isLegend: true, type: "Legendary Creature", archetype: "Energy", colors: ["G"] },
        "Saheeli, Consul of Oversight": { isLegend: true, type: "Legendary Creature", archetype: "Energy", colors: ["U","R"] },
        "Loot, the Nexus": { isLegend: true, type: "Legendary Creature", archetype: "All", colors: ["G","U","R"] },
        "Winter, Team Player": { isLegend: true, type: "Legendary Creature", archetype: "Aristocrats", colors: ["B","R"] },
        "Tetsuko Umezawa, Pursuer": { isLegend: true, type: "Legendary Creature", archetype: "TMNT", colors: ["U"] },
        "Arni, Renowned Champion": { isLegend: true, type: "Legendary Creature", archetype: "TMNT", colors: ["R"] },
        "Teyo, Lightshield Expert": { isLegend: true, type: "Legendary Creature", archetype: "All", colors: ["W"] },
        "Koth, the Geomancer": { isLegend: true, type: "Planeswalker", archetype: "All", colors: ["R"] }
    };

    // Auto-generate master array
    const masterCatalog = rawCardNames.map(name => {
        if (legendsMetadata[name]) {
            return { name: name, ...legendsMetadata[name] };
        }
        let cardType = "Creature";
        let cardArch = "General Pool";
        if (name.includes("Land") || ["Swamp","Forest","Plains","Mountain","Island","Meticulous Commons","Slingerquill Annex","Vigorbloom Annex","Goblin-town"].includes(name)) cardType = "Land";
        else if (["Arcane Signet","Chromatic Lantern","Talisman of Impulse","Hedron Archive","Mind Stone","Reckoner Bankbuster","Mirage Mirror","Sting, Bilbo's Sword","The Endstone"].includes(name)) cardType = "Artifact";
        else if (["Brotherhood's End","Kindred Judgment","Fatehold Charm","Wrath of the Bloodmane","Bilbo's Deadly Slice","Gnashing of Teeth","Pillage the Bog","Gleeful Sabotage","Compel Brutality","Restore with Empathy"].includes(name)) cardType = "Instant/Sorcery";

        if (["Desolation Twin","Writhing Chrysalis","Catacomb Sifter","Bane of Bala Ged"].includes(name)) cardArch = "Eldrazi";
        else if (["Dreadfeast Demon","Overseer of the Damned","Pestilence Demon","Thallid Devourer","Sporecrown Thallid","Deathbloom Thallid","Tukatongue Thallid","Thraxodemon","Eater of Hope","Graft Surgeon"].includes(name)) cardArch = "Aristocrats";
        else if (["Frodo, Adventurous Hobbit","Sam, Loyal Attendant","Thranduil, Sindarin Liege","Bilbo Baggins, Burglar","Beorn, Reluctant Host","Gollum, Silent Slinker"].includes(name)) cardArch = "Food";

        return { name: name, type: cardType, archetype: cardArch, isLegend: false };
    });

    function populateCommanders() {
        const dropdown = document.getElementById("commanderDropdown");
        dropdown.innerHTML = "";
        
        const legends = masterCatalog.filter(c => c.isLegend);
        legends.forEach(legend => {
            const opt = document.createElement("option");
            opt.value = legend.name;
            opt.innerText = `${legend.name} (${legend.type} • ${legend.archetype})`;
            dropdown.appendChild(opt);
        });
    }

    function renderCollection(cards) {
        const container = document.getElementById("cardContainer");
        container.innerHTML = "";
        document.getElementById("cardCounter").innerText = `${masterCatalog.length} Cards Indexed`;

        cards.slice(0, 100).forEach(card => {
            const cardEl = document.createElement("div");
            cardEl.className = "card-item";
            const imgUrl = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&format=image`;

            cardEl.innerHTML = `
                <img class="card-img" src="${imgUrl}" alt="${card.name}" loading="lazy" onerror="this.src='https://cards.scryfall.io/back.png'">
                <div class="card-info">
                    <div class="card-title">${card.name}</div>
                    <div class="card-type">${card.type}</div>
                    <span class="tag">${card.archetype}</span>
                </div>
            `;
            container.appendChild(cardEl);
        });
    }

    function filterCollection() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const type = document.getElementById("typeFilter").value;
        const tag = document.getElementById("tagFilter").value;

        const filtered = masterCatalog.filter(c => {
            const matchSearch = c.name.toLowerCase().includes(search);
            const matchType = type === "ALL" || (type === "Legendary" && c.isLegend) || c.type.includes(type);
            const matchTag = tag === "ALL" || c.archetype === tag;
            return matchSearch && matchType && matchTag;
        });

        renderCollection(filtered);
    }

    function switchTab(tabId, evt) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        evt.target.classList.add("active");
    }

    function buildSmartDeck() {
        const cmdName = document.getElementById("commanderDropdown").value;
        const commander = masterCatalog.find(c => c.name === cmdName);
        const display = document.getElementById("deckDisplay");
        display.style.display = "grid";

        // Filter valid cards matching Commander or General Archetype
        const validPool = masterCatalog.filter(c => c.name !== cmdName);
        const creatures = validPool.filter(c => c.type === "Creature" || c.type === "Legendary Creature");
        const spells = validPool.filter(c => c.type === "Instant/Sorcery");
        const artifacts = validPool.filter(c => c.type === "Artifact");
        const nonBasicLands = validPool.filter(c => c.type === "Land" && !["Swamp","Forest","Plains","Mountain","Island"].includes(c.name));

        // Build 100-card ratios
        const selectedCreatures = creatures.slice(0, 32);
        const selectedSpells = spells.slice(0, 18);
        const selectedArtifacts = artifacts.slice(0, 12);
        const selectedLands = nonBasicLands.slice(0, 6);

        // Basic land fill to reach exactly 100
        const totalNonLand = 1 + selectedCreatures.length + selectedSpells.length + selectedArtifacts.length + selectedLands.length;
        const basicLandNeeded = 100 - totalNonLand;

        display.innerHTML = `
            <div class="deck-col">
                <h3>Command Zone (1)</h3>
                <ul><li><strong>1x ${commander.name}</strong></li></ul>
                <h3>Synergy Creatures (${selectedCreatures.length})</h3>
                <ul>
                    ${selectedCreatures.map(c => `<li>1x ${c.name}</li>`).join("")}
                </ul>
            </div>
            <div class="deck-col">
                <h3>Removal & Spells (${selectedSpells.length})</h3>
                <ul>
                    ${selectedSpells.map(c => `<li>1x ${c.name}</li>`).join("")}
                </ul>
                <h3>Artifacts & Ramp (${selectedArtifacts.length})</h3>
                <ul>
                    ${selectedArtifacts.map(c => `<li>1x ${c.name}</li>`).join("")}
                </ul>
            </div>
            <div class="deck-col"
