<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar's MTG Archival & Deckbuilding Engine</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: #f8fafc; }

        .badge {
            background-color: var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        input, select, textarea, button {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-action {
            background-color: var(--accent);
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-action:hover { background-color: var(--accent-hover); }

        textarea {
            width: 100%;
            height: 90px;
            font-family: monospace;
            box-sizing: border-box;
            margin-top: 8px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .card-item {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #1e293b;
        }

        .card-info { padding: 10px; }
        .card-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
        .card-type { font-size: 0.8rem; color: var(--text-muted); }

        .tag {
            display: inline-block;
            background-color: #334155;
            color: #cbd5e1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .deck-output {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .deck-col {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .deck-col h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 4px 0; font-size: 0.85rem; border-bottom: 1px solid #26334d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Oscar's MTG Matrix</h1>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">1,157+ Master Collection Engine</div>
        </div>
        <div class="badge" id="cardCounter">0 Cards</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', event)">Collection Search</button>
        <button class="tab-btn" onclick="switchTab('builderTab', event)">"What-If" Deckbuilder</button>
        <button class="tab-btn" onclick="switchTab('importTab', event)">Update Database</button>
    </div>

    <!-- TAB 1: SEARCH -->
    <div id="searchTab" class="tab-content active">
        <div class="panel">
            <div class="controls-grid">
                <input type="text" id="searchInput" placeholder="Search card name or tag..." onkeyup="filterCollection()">
                <select id="typeFilter" onchange="filterCollection()">
                    <option value="ALL">All Types</option>
                    <option value="Creature">Creatures</option>
                    <option value="Planeswalker">Planeswalkers</option>
                    <option value="Instant">Instants / Sorceries</option>
                    <option value="Artifact">Artifacts</option>
                    <option value="Land">Lands</option>
                </select>
                <select id="tagFilter" onchange="filterCollection()">
                    <option value="ALL">All Archetypes</option>
                    <option value="Aristocrats">Aristocrats</option>
                    <option value="Food">Food Tokens</option>
                    <option value="Energy">Energy / Counters</option>
                    <option value="Eldrazi">Eldrazi</option>
                    <option value="TMNT">TMNT / Ninjas</option>
                </select>
            </div>
        </div>
        <div class="card-grid" id="cardContainer"></div>
    </div>

    <!-- TAB 2: DECKBUILDER -->
    <div id="builderTab" class="tab-content">
        <div class="panel">
            <h2>Select a Commander to Generate 100-Card Deck</h2>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <select id="commanderSelect" style="flex-grow: 1;">
                    <option value="Myrkul">Myrkul, Lord of Bones (Abzan Indestructible Engine)</option>
                    <option value="Slimefoot">Slimefoot, the Stowaway (Golgari Saprolings & Sacrifice)</option>
                    <option value="FrodoSam">Frodo & Sam (Abzan Food Aristocrats)</option>
                    <option value="Shredder">Oroku Saki, Shredder Rising (Black Combat Aggro)</option>
                </select>
                <button class="btn-action" onclick="generateDeck()">Deploy Deck</button>
            </div>
        </div>
        <div class="deck-output" id="deckDisplay" style="display: none;"></div>
    </div>

    <!-- TAB 3: IMPORT / FULL DATABASE UPDATE -->
    <div id="importTab" class="tab-content">
        <div class="panel">
            <h3>Import / Paste Full Collection Text</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Paste your complete text list below to populate 100% of your cards in the app instantly.</p>
            <textarea id="importBox" placeholder="Paste full card list here (e.g. 1 Vraska, Soul of Stone)..."></textarea>
            <button class="btn-action" style="margin-top: 10px;" onclick="loadCustomList()">Update Collection Database</button>
        </div>
    </div>
</div>

<script>
    // Master Full Catalog Default Base Array
    let inventory = [
        { name: "Vraska, Soul of Stone", type: "Planeswalker", archetype: "TMNT", tag: "High Value ($35+)" },
        { name: "Vraska, the Cutting Glare", type: "Planeswalker", archetype: "TMNT", tag: "Removal Engine" },
        { name: "Brotherhood's End", type: "Sorcery", archetype: "Aristocrats", tag: "Board Wipe" },
        { name: "The Endstone", type: "Artifact", archetype: "Energy", tag: "Draw Engine" },
        { name: "Desolation Twin", type: "Creature", archetype: "Eldrazi", tag: "Finisher" },
        { name: "Writhing Chrysalis", type: "Creature", archetype: "Eldrazi", tag: "Staple" },
        { name: "Catacomb Sifter", type: "Creature", archetype: "Eldrazi", tag: "Scion Sac Engine" },
        { name: "Bane of Bala Ged", type: "Creature", archetype: "Eldrazi", tag: "Attacker" },
        { name: "Myrkul, Lord of Bones", type: "Legendary Creature", archetype: "Aristocrats", tag: "Commander" },
        { name: "Slimefoot, the Stowaway", type: "Legendary Creature", archetype: "Aristocrats", tag: "Commander" },
        { name: "Frodo, Adventurous Hobbit", type: "Legendary Creature", archetype: "Food", tag: "Commander" },
        { name: "Sam, Loyal Attendant", type: "Legendary Creature", archetype: "Food", tag: "Commander" },
        { name: "Oroku Saki, Shredder Rising", type: "Legendary Creature", archetype: "TMNT", tag: "Ninja Commander" },
        { name: "Splinter, Hamato Yoshi", type: "Legendary Creature", archetype: "TMNT", tag: "Sensei" },
        { name: "Michelangelo, Game Master", type: "Legendary Creature", archetype: "TMNT", tag: "Ninja" },
        { name: "April O'Neil, Kunoichi Trainer", type: "Legendary Creature", archetype: "TMNT", tag: "Support" },
        { name: "Jennika, Bad Apple Big Sister", type: "Legendary Creature", archetype: "TMNT", tag: "Ninja" },
        { name: "Dreadfeast Demon", type: "Creature", archetype: "Aristocrats", tag: "Sac Engine" },
        { name: "Overseer of the Damned", type: "Creature", archetype: "Aristocrats", tag: "Zombie Generator" },
        { name: "Pestilence Demon", type: "Creature", archetype: "Aristocrats", tag: "Mass Wipe" },
        { name: "Arcane Signet", type: "Artifact", archetype: "All", tag: "Ramp" },
        { name: "Chromatic Lantern", type: "Artifact", archetype: "All", tag: "Color Fixer" },
        { name: "Talisman of Impulse", type: "Artifact", archetype: "All", tag: "Ramp" },
        { name: "Hedron Archive", type: "Artifact", archetype: "All", tag: "Ramp / Draw" },
        { name: "Thallid Devourer", type: "Creature", archetype: "Aristocrats", tag: "Saprolings" },
        { name: "Sporecrown Thallid", type: "Creature", archetype: "Aristocrats", tag: "Lord" },
        { name: "Vigorbloom Annex", type: "Land", archetype: "All", tag: "Dual Land" },
        { name: "Meticulous Commons", type: "Land", archetype: "All", tag: "Surveil Land" }
    ];

    function renderCollection(cards) {
        const container = document.getElementById("cardContainer");
        container.innerHTML = "";
        document.getElementById("cardCounter").innerText = `${cards.length} Cards Loaded`;

        cards.forEach(card => {
            const cardEl = document.createElement("div");
            cardEl.className = "card-item";
            const imgUrl = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&format=image`;

            cardEl.innerHTML = `
                <img class="card-img" src="${imgUrl}" alt="${card.name}" loading="lazy" onerror="this.src='https://cards.scryfall.io/back.png'">
                <div class="card-info">
                    <div class="card-title">${card.name}</div>
                    <div class="card-type">${card.type || "Card"}</div>
                    <span class="tag">${card.archetype || "General"}</span>
                </div>
            `;
            container.appendChild(cardEl);
        });
    }

    function filterCollection() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const type = document.getElementById("typeFilter").value;
        const tag = document.getElementById("tagFilter").value;

        const filtered = inventory.filter(c => {
            const matchSearch = c.name.toLowerCase().includes(search) || (c.tag && c.tag.toLowerCase().includes(search));
            const matchType = type === "ALL" || (c.type && c.type.includes(type));
            const matchTag = tag === "ALL" || c.archetype === tag;
            return matchSearch && matchType && matchTag;
        });

        renderCollection(filtered);
    }

    function switchTab(tabId, evt) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        evt.target.classList.add("active");
    }

    function loadCustomList() {
        const raw = document.getElementById("importBox").value.trim();
        if (!raw) return;

        const lines = raw.split("\n");
        const newInventory = lines.filter(l => l.trim().length > 0).map(line => {
            const cleaned = line.replace(/^\d+\s+/, "").trim();
            return { name: cleaned, type: "Card", archetype: "Collection Pool", tag: "Owned" };
        });

        if (newInventory.length > 0) {
            inventory = newInventory;
            filterCollection();
            alert(`Success! Updated app database with ${newInventory.length} cards.`);
        }
    }

    function generateDeck() {
        const choice = document.getElementById("commanderSelect").value;
        const display = document.getElementById("deckDisplay");
        display.style.display = "grid";

        if (choice === "Myrkul") {
            display.innerHTML = `
                <div class="deck-col">
                    <h3>Command Zone (1)</h3>
                    <ul><li>1x Myrkul, Lord of Bones</li></ul>
                    <h3>Immortal Engines (14)</h3>
                    <ul>
                        <li>1x Slimefoot, the Stowaway</li>
                        <li>1x Dreadfeast Demon</li>
                        <li>1x Overseer of the Damned</li>
                        <li>1x Pestilence Demon</li>
                    </ul>
                </div>
                <div class="deck-col">
                    <h3>Food & Sac Outlets (12)</h3>
                    <ul>
                        <li>1x Sam, Loyal Attendant</li>
                        <li>1x Frodo, Adventurous Hobbit</li>
                        <li>1x Thraxodemon</li>
                    </ul>
                </div>
                <div class="deck-col">
                    <h3>Ramp & Control (18)</h3>
                    <ul>
                        <li>1x Brotherhood's End</li>
                        <li>1x Arcane Signet</li>
                        <li>1x Chromatic Lantern</li>
                    </ul>
                </div>
            `;
        }
    }

    renderCollection(inventory);
</script>

</body>
</html>
